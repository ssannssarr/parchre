name: Make Repository

on:
  workflow_dispatch:
  push:
    branches: [main]          # change to master if that's your default branch
  schedule:
    - cron: "21 4 * * 0"      # weekly rebuild, Sundays 04:21 UTC

permissions: {}

concurrency:
  group: make-repository
  cancel-in-progress: false

jobs:
  # Job 1: builds AUR packages (runs unreviewed PKGBUILDs). Read-only, no secrets.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      # TODO: replace @v1 with a full commit SHA of kopp/build-aur-packages
      - name: Build packages
        uses: kopp/build-aur-packages@v1
        with:
          packages:
            minecraft-launcher
          # missing_pacman_dependencies: >
          #   libusb-compat

      # Resolve symlinks (aurci2.db -> aurci2.db.tar.*) so release upload works
      - name: Stage files
        run: |
          mkdir -p /tmp/stage
          find "$GITHUB_WORKSPACE" -maxdepth 1 \( -type f -o -type l \) \
            -exec cp -L -t /tmp/stage {} +
          cd /tmp/stage
          mv minecraft-launcher-1:2.1.3-3-x86_64.pkg.tar.zst minecraft-launcher-x86_64.pkg.tar.zst
          mv aurci2.db parchre.db
          mv aurci2.files parchre.files
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: repo
          path: /tmp/stage/*
          if-no-files-found: error

  # Job 2: only publishes. Never runs any PKGBUILD.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: repo
          path: stage

      - name: Replace release contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete parchre -R "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create parchre -R "$GITHUB_REPOSITORY" \
            --title "build $GITHUB_RUN_NUMBER" \
            --notes "pacman repo, build $GITHUB_RUN_NUMBER" \
            stage/*
